name: Docs Link Check

on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request supersedes the run in progress. A reopen doesn't: it lands on the same commit, so it
# queues behind that run instead of leaving a CANCELLED check on the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fail if the globs match nothing, so a future path change can't
          # silently turn this back into a no-op.
          failIfEmpty: true
          # `--offline` validates relative/internal doc links (and their
          # #fragments) without hitting the network, so PRs don't fail on
          # third-party outages or rate limits.
          args: --offline --include-fragments --verbose --no-progress "*.md" "docs/**/*.md" "plugin/**/*.md"
