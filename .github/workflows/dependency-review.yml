name: Dependency security gate

# Public repos get actions/dependency-review-action (and the dependency-graph
# compare API it needs) for free, so this uses it directly.

on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request supersedes the run in progress. A reopen doesn't: it lands on the same commit, so it
# queues behind that run instead of leaving a CANCELLED check on the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  dependency-review:
    name: Dependency review
    # The compare API answers 403 on private repos without GitHub Advanced Security.
    # Skip until the repo is public; the gate then turns on with no further change.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on findings of moderate severity or higher.
          fail-on-severity: moderate
