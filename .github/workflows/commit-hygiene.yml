name: Commit hygiene

on:
  pull_request:
    # `edited` so fixing the PR title or description re-runs the check.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs every commit between the PR base and head
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The fixtures pin what must be caught and what must pass, so a change to
      # the patterns in this PR cannot silently start missing attribution or
      # flagging normal text. They test the PR's own copy of the script.
      - name: Test the hygiene patterns
        run: python3 .github/scripts/test_check_commit_hygiene.py

      # The gate itself runs the checker as it is on the base branch, so a PR
      # cannot weaken the check that judges it. Changes to this workflow file
      # are covered by the required maintainer review.
      - name: Load the checker from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git show "${BASE_SHA}:.github/scripts/check_commit_hygiene.py" >"${RUNNER_TEMP}/check_commit_hygiene.py" 2>/dev/null; then
            echo "Using the checker from the base branch (${BASE_SHA:0:7})."
          else
            echo "::warning::The base branch has no checker yet; using this PR's copy."
            cp .github/scripts/check_commit_hygiene.py "${RUNNER_TEMP}/check_commit_hygiene.py"
          fi

      # Title and body go through the environment, never into the script text,
      # so PR-controlled content cannot inject shell.
      - name: Check commit emails, messages and PR description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "${RUNNER_TEMP}/check_commit_hygiene.py" --base "$BASE_SHA" --head "$HEAD_SHA"
