name: autofix.ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The fix commit is pushed by the autofix.ci GitHub App, not GITHUB_TOKEN, so the
# token stays read-only: this job runs PR-controlled Trunk config.
permissions:
  contents: read

jobs:
  trunk-fmt-and-autofix:
    # Privileged: the autofix.ci app commits this job's output to the PR branch.
    cache-mode: none
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Trunk's launcher 1.3.5 checked by sha256, not trunk-action's unchecked download. Inline: this public repository
      # uses nothing from the private shared-workflows. The launcher checks the CLI against .trunk/trunk.yaml's sha256.
      - name: Install the Trunk launcher
        id: trunk_launcher
        env:
          SHA256: 700f8bbedfd226595999ea2202b9a7af75ba8398dd711f5f159f5bbba6cbf322
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trunk-launcher"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/trunk" https://trunk.io/releases/launcher/1.3.5/trunk
          echo "$SHA256  $dir/trunk" | sha256sum -c --quiet -
          chmod +x "$dir/trunk"
          echo "$dir" >> "$GITHUB_PATH"
          echo "TRUNK_LAUNCHER_QUIET=false" >> "$GITHUB_ENV" # a CLI sha256 mismatch then says so
          echo "path=$dir/trunk" >> "$GITHUB_OUTPUT"

      - name: Trunk Format
        run: trunk fmt

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
