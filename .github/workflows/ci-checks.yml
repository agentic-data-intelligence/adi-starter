name: CI checks (lint, plugin manifests)

on:
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trunk:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trunk Check Results
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  # actionlint's checks and the rules zizmor lacks, against .github/jactionlint.yaml (the organisation's policy), in
  # place of Trunk's actionlint. The release binary is checked by sha256 before it is unpacked; no token, nothing online.
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jactionlint 2.5.0 for Linux x64; the sha256 is the release's checksums file, matching GitHub's digest of the
      # asset.
      - name: Install jactionlint
        env:
          SHA256: 5ac307b0499bb0eab45ae99c23e8e0790874fbc667c75224410954e0e3c6e0f5
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jactionlint"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/jactionlint.tar.gz" \
            https://github.com/jdx/jactionlint/releases/download/v2.5.0/jactionlint_2.5.0_linux_amd64.tar.gz
          echo "$SHA256  $dir/jactionlint.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$dir/jactionlint.tar.gz" -C "$dir" jactionlint
          rm "$dir/jactionlint.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"

      # Findings are annotations, and fail the job. While .github/jactionlint-baseline.json exists, it holds the ones that
      # don't count, and --baseline-check fails on an entry that matches nothing any more (unused-baseline-entry: error),
      # so a stale entry can't keep accepting a line that comes back. Without the file, the flag would be an error.
      - name: jactionlint
        run: |
          set -euo pipefail
          args=(--no-online --no-hints --format github)
          if [ -f .github/jactionlint-baseline.json ]; then args+=(--baseline-check); fi
          jactionlint "${args[@]}"

  plugin-manifests:
    name: Plugin manifests consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CONTRIBUTING.md: a version bump must land in every plugin/*/plugin.json
      # and every root marketplace.json. Catch the one that was missed.
      - name: Check plugin name, version and source agree across manifests
        run: |
          set -euo pipefail
          plugin_manifests=(plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json plugin/.cursor-plugin/plugin.json plugin/plugin.json)
          marketplaces=(.claude-plugin/marketplace.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json)

          expected_version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          expected_name="$(jq -r .name plugin/.claude-plugin/plugin.json)"
          echo "Expected: name=${expected_name} version=${expected_version}"
          status=0

          for f in "${plugin_manifests[@]}"; do
            name="$(jq -r .name "$f")"
            version="$(jq -r .version "$f")"
            if [[ "$name" != "$expected_name" || "$version" != "$expected_version" ]]; then
              echo "::error file=${f}::expected name=${expected_name} version=${expected_version}, found name=${name} version=${version}"
              status=1
            fi
          done

          for f in "${marketplaces[@]}"; do
            # The Claude and Cursor marketplaces also carry a top-level metadata.version.
            metadata_version="$(jq -r '.metadata.version // empty' "$f")"
            if [[ -n "$metadata_version" && "$metadata_version" != "$expected_version" ]]; then
              echo "::error file=${f}::metadata.version should be ${expected_version}, found ${metadata_version}"
              status=1
            fi
            # Not every marketplace format carries a version (e.g. Codex); compare it only where present.
            mismatches="$(jq -r --arg n "$expected_name" --arg v "$expected_version" '
              .plugins[] | select(.name == $n)
              | select((.version != null and .version != $v) or ((.source | if type == "object" then .path else . end) | sub("/$"; "") != "./plugin"))
              | "version=\(.version // "-") source=\(.source | tostring)"' "$f")"
            if ! jq -e --arg n "$expected_name" '.plugins | any(.name == $n)' "$f" >/dev/null; then
              echo "::error file=${f}::no plugin entry named ${expected_name}"
              status=1
            elif [[ -n "$mismatches" ]]; then
              echo "::error file=${f}::plugin ${expected_name} should be version ${expected_version} with source ./plugin, found ${mismatches}"
              status=1
            fi
          done

          exit "$status"
