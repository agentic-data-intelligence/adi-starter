name: CI checks (lint, plugin manifests)

on:
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trunk:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trunk Check Results
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  plugin-manifests:
    name: Plugin manifests consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CONTRIBUTING.md: a version bump must land in every plugin/*/plugin.json
      # and every root marketplace.json. Catch the one that was missed.
      - name: Check plugin name, version and source agree across manifests
        run: |
          set -euo pipefail
          plugin_manifests=(plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json plugin/.cursor-plugin/plugin.json plugin/.plugin/plugin.json)
          marketplaces=(.claude-plugin/marketplace.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json)

          expected_version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          expected_name="$(jq -r .name plugin/.claude-plugin/plugin.json)"
          echo "Expected: name=${expected_name} version=${expected_version}"
          status=0

          for f in "${plugin_manifests[@]}"; do
            name="$(jq -r .name "$f")"
            version="$(jq -r .version "$f")"
            if [[ "$name" != "$expected_name" || "$version" != "$expected_version" ]]; then
              echo "::error file=${f}::expected name=${expected_name} version=${expected_version}, found name=${name} version=${version}"
              status=1
            fi
          done

          for f in "${marketplaces[@]}"; do
            # The Claude and Cursor marketplaces also carry a top-level metadata.version.
            metadata_version="$(jq -r '.metadata.version // empty' "$f")"
            if [[ -n "$metadata_version" && "$metadata_version" != "$expected_version" ]]; then
              echo "::error file=${f}::metadata.version should be ${expected_version}, found ${metadata_version}"
              status=1
            fi
            # Not every marketplace format carries a version (e.g. Codex); compare it only where present.
            mismatches="$(jq -r --arg n "$expected_name" --arg v "$expected_version" '
              .plugins[] | select(.name == $n)
              | select((.version != null and .version != $v) or ((.source | if type == "object" then .path else . end) | sub("/$"; "") != "./plugin"))
              | "version=\(.version // "-") source=\(.source | tostring)"' "$f")"
            if ! jq -e --arg n "$expected_name" '.plugins | any(.name == $n)' "$f" >/dev/null; then
              echo "::error file=${f}::no plugin entry named ${expected_name}"
              status=1
            elif [[ -n "$mismatches" ]]; then
              echo "::error file=${f}::plugin ${expected_name} should be version ${expected_version} with source ./plugin, found ${mismatches}"
              status=1
            fi
          done

          exit "$status"
