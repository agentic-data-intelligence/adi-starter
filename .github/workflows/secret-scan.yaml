name: secret-scan

on:
  pull_request: {}
  schedule:
    # Mondays 05:19 UTC: history scan of every branch
    - cron: 19 5 * * 1
  workflow_dispatch: {}

permissions: {}

jobs:
  secret-scan:
    permissions:
      actions: read # history-notice: find the latest history run and download its results
      contents: read # checkout
      pull-requests: write # history-notice: sticky PR comment
    uses: agentic-data-intelligence/shared-workflows/.github/workflows/secret-scan.yaml@main
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pull_request' || 'history' }}
