name: Plugin checks

on:
  pull_request:

permissions: read-all

concurrency:
  group: plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-plugin-validate:
    name: Claude Code plugin validate
    runs-on: ubuntu-latest
    env:
      # Bump deliberately: newer releases can add validation rules.
      CLAUDE_CODE_VERSION: 2.1.287
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --strict turns warnings (unknown fields, missing description/author, ...) into failures.
      - name: Validate marketplace manifest
        run: npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .

      - name: Validate plugin manifest
        run: npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict ./plugin

  skills-and-schemas:
    name: Skill frontmatter, version bumps and schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version-bump check diffs against the PR base

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check skill frontmatter and version bumps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-project --python 3.13 --with pyyaml==6.0.3 python .github/scripts/check_skills.py --base "$BASE_SHA"

      - name: Check authoring JSON Schemas
        run: uv run --no-project --python 3.13 --with jsonschema==4.26.0 python .github/scripts/check_schemas.py

  mcp-config:
    name: MCP config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plugin authenticates with OAuth only. Credential headers in the shipped
      # stub would bring back the retired static-key path, so refuse them.
      - name: Check plugin/mcp.json
        run: |
          set -euo pipefail
          f=plugin/mcp.json
          problems="$(jq -r '
            (.mcpServers // {}) as $s
            | (if ."$schema" != "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json" then "$schema must be the Agent Plugins 1.0.0 MCP schema, found \(."$schema" | tostring)" else empty end),
              if ($s | type) != "object" then "mcpServers must be an object of name -> server, found \($s | type)"
              elif ($s | length) != 1 then "expected exactly one server, found \($s | length)" else empty end,
              ($s | objects | to_entries[]
                | .key as $k | .value
                | (if .type != "streamable-http" then "\($k): type must be \"streamable-http\", found \(.type | tostring)" else empty end),
                  (if (.url | tostring | startswith("https://")) | not then "\($k): url must be https, found \(.url | tostring)" else empty end),
                  (if has("headers") or has("env_http_headers") or has("bearer_token_env_var") then "\($k): must not set credential headers; the plugin authenticates with OAuth" else empty end))
          ' "$f")"
          if [[ -n "$problems" ]]; then
            while IFS= read -r p; do echo "::error file=${f}::${p}"; done <<<"$problems"
            exit 1
          fi
          echo "OK: $(jq -c '.mcpServers' "$f")"

  mcp-endpoint:
    name: MCP endpoint liveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unauthenticated: follows the OAuth discovery chain an MCP client walks on
      # first connect (401 challenge -> protected resource metadata -> authorization
      # server metadata) for the URL the plugin ships. No credential is sent.
      - name: Probe the shipped MCP endpoint
        run: |
          set -euo pipefail
          url="$(jq -r '.mcpServers | to_entries[0].value.url' plugin/mcp.json)"
          echo "Endpoint: ${url}"
          fail() { echo "::error file=plugin/mcp.json::${url}: $*"; exit 1; }
          get() { curl -sS --fail --max-time 20 --retry 3 --retry-all-errors "$1"; }

          headers="$(curl -sS --max-time 20 --retry 3 --retry-all-errors -o /dev/null -D - -X POST "$url" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"adi-starter-ci","version":"0"}}}')" \
            || fail "request failed"
          status="$(awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}' <<<"$headers")"
          [[ "$status" == 401 ]] || fail "unauthenticated initialize returned HTTP ${status}, expected 401"
          # Only a Bearer challenge counts; `|| true` so a missing header reaches the annotation below.
          resource_metadata="$( { grep -iE '^www-authenticate:[[:space:]]*bearer([[:space:]]|$)' <<<"$headers" || true; } \
            | sed -nE 's/.*resource_metadata="([^"]+)".*/\1/p' | head -n1 | tr -d '\r')"
          [[ -n "$resource_metadata" ]] || fail "401 has no WWW-Authenticate: Bearer challenge with resource_metadata"
          echo "401 OK, resource metadata: ${resource_metadata}"

          resource="$(get "$resource_metadata")" || fail "could not fetch ${resource_metadata}"
          [[ "$(jq -r .resource <<<"$resource")" == "$url" ]] || fail "protected resource metadata names resource $(jq -r .resource <<<"$resource")"
          issuer="$(jq -r '.authorization_servers[0] // empty' <<<"$resource")"
          [[ -n "$issuer" ]] || fail "protected resource metadata lists no authorization_servers"
          echo "Authorization server: ${issuer}"

          as_metadata="$(get "${issuer%/}/.well-known/oauth-authorization-server")" || fail "could not fetch authorization server metadata for ${issuer}"
          missing="$(jq -r '
            [ (if .authorization_endpoint then empty else "authorization_endpoint" end),
              (if .token_endpoint then empty else "token_endpoint" end),
              (if (.code_challenge_methods_supported // []) | index("S256") then empty else "S256 PKCE" end),
              (if .registration_endpoint or .client_id_metadata_document_supported then empty else "client registration" end)
            ] | join(", ")' <<<"$as_metadata")"
          [[ -z "$missing" ]] || fail "authorization server metadata is missing: ${missing}"
          echo "Authorization server metadata OK"
