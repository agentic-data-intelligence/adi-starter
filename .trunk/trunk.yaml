#
# Trunk configuration. Only the linters relevant to this repo (Markdown, JSON, GitHub Actions,
# CI scripts) are enabled.
version: 0.1
cli:
  version: 1.25.0
  # The launcher checks the CLI it downloads against these.
  # `trunk upgrade` rewrites these with the version. Each <os>_<arch>: key on one line only: the launcher greps the
  # whole file for it.
  sha256:
    darwin_arm64: 2cff4f1cc63916db290359a058b88167beeac07a496682d9307a1804b498f225
    darwin_x86_64: d0153b87a7eba4cd7d09a048b97bd60ac3ac15352def2bc3599d548875823ed3
    linux_arm64: cc210d2185cf95bedbec06384be6ef342bdb7dcf3ff72dd08fe0e69859516887
    linux_x86_64: 3845ff76a70cebb10e61a267ff719ffdccfa3ef6d877d51870a2c62b79603ab9
    mingw_x86_64: 739f6aabc91d9ba4bce894314e01ab56d2c11b573c921b6f8caed6393c66c5f1
plugins:
  sources:
    - id: trunk
      # v1.11.0, by commit: the plugins define every linter's download, and a tag can be moved.
      ref: d1e3af5752059371e206fe8f242b15d7f4205555
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.13.3
lint:
  enabled:
    - checkov@3.2.524
    - git-diff-check
    - markdownlint@0.48.0
    - prettier@3.8.3
    - ruff@0.15.12:
        commands: [lint, format]
    - trufflehog@3.95.2
    - yamllint@1.38.0
    - zizmor@1.24.1
  disabled:
    # Unmaintained since 2026-04 and rejects `$/`: the jactionlint job in ci-checks.yml runs its checks.
    - actionlint
actions:
  definitions:
    # jactionlint before a push, as CI's jactionlint job runs it (.github/scripts/jactionlint-pre-push.sh): the pinned
    # release checked by sha256. Findings and config errors block the push; when the check can't run (a failed download
    # or sha256 check, an unsupported platform), it says so and lets the push through, since CI still checks.
    - id: jactionlint-pre-push
      display_name: jactionlint
      description: Lint GitHub Actions workflows with jactionlint and this repository's policy
      run: bash .github/scripts/jactionlint-pre-push.sh
      triggers:
        - git_hooks: [pre-push]
  disabled:
    - trunk-announce
  enabled:
    - jactionlint-pre-push
    - trunk-upgrade-available
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
