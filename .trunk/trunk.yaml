#
# Trunk configuration. Only the linters relevant to this repo (Markdown, JSON, GitHub Actions,
# CI scripts) are enabled.
version: 0.1
cli:
  version: 1.25.0
  # tools/trunk (the pinned launcher) checks the downloaded CLI against these.
  # `trunk upgrade` rewrites these with the version. Each <os>_<arch>: key on one line only: the launcher greps the
  # whole file for it.
  sha256:
    darwin_arm64: 2cff4f1cc63916db290359a058b88167beeac07a496682d9307a1804b498f225
    darwin_x86_64: d0153b87a7eba4cd7d09a048b97bd60ac3ac15352def2bc3599d548875823ed3
    linux_arm64: cc210d2185cf95bedbec06384be6ef342bdb7dcf3ff72dd08fe0e69859516887
    linux_x86_64: 3845ff76a70cebb10e61a267ff719ffdccfa3ef6d877d51870a2c62b79603ab9
    mingw_x86_64: 739f6aabc91d9ba4bce894314e01ab56d2c11b573c921b6f8caed6393c66c5f1
plugins:
  sources:
    - id: trunk
      # v1.11.0, by commit: the plugins define every linter's download, and a tag can be moved.
      ref: d1e3af5752059371e206fe8f242b15d7f4205555
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.13.3
lint:
  enabled:
    - actionlint@1.7.12
    - checkov@3.2.524
    - git-diff-check
    - markdownlint@0.48.0
    - prettier@3.8.3
    - ruff@0.15.12:
        commands: [lint, format]
    - trufflehog@3.95.2
    - yamllint@1.38.0
    - zizmor@1.24.1
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-upgrade-available
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
