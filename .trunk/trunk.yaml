#
# Trunk configuration. Only the linters relevant to this repo (Markdown, JSON, GitHub Actions,
# CI scripts) are enabled.
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.13.3
lint:
  enabled:
    - checkov@3.2.524
    - git-diff-check
    - markdownlint@0.48.0
    - prettier@3.8.3
    - ruff@0.15.12:
        commands: [lint, format]
    - trufflehog@3.95.2
    - yamllint@1.38.0
  disabled:
    # Unmaintained since 2026-04 and rejects `$/`: the jactionlint job in ci-checks.yml runs its checks.
    - actionlint
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-upgrade-available
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
